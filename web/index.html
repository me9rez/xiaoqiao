<!DOCTYPE html>
<html lang="zh-CN" data-color-scheme="light" data-font-scale="medium">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
    <title>小巧</title>
    <script>
      // Apply stored theme before first paint. Keys must match src/theme.ts.
      (function () {
        var root = document.documentElement
        try {
          // Prefer the new keys; migrate the pre-rename ones on first boot.
          function stored(key, legacyKey) {
            var value = localStorage.getItem(key)
            if (value !== null) return value
            var legacy = localStorage.getItem(legacyKey)
            if (legacy !== null) {
              localStorage.setItem(key, legacy)
              localStorage.removeItem(legacyKey)
            }
            return legacy
          }
          var scheme = stored('xiaoqiao:color-scheme', 'coding-agent:color-scheme') || 'system'
          var scale = stored('xiaoqiao:font-scale', 'coding-agent:font-scale') || 'medium'
          var dark = scheme === 'dark' ||
            (scheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          root.dataset.colorPreference = scheme
          root.dataset.colorScheme = dark ? 'dark' : 'light'
          root.dataset.fontScale = scale
        } catch (error) {
          // localStorage unavailable; keep defaults from the html tag.
        }
      })()
    </script>
    <!-- Fonts are bundled from npm (see src/main.ts) so the desktop shell works offline. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
